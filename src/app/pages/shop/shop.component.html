<app-header></app-header>
<!-- Breadcrumb Section Begin -->
<section class="breadcrumb-section" style="background-image: url('assets/img/breadcrumb.jpg');">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <div class="breadcrumb__text">
          <h2>Organi Shop</h2>
          <div class="breadcrumb__option">
            <a routerLink="/">Home</a>
            <span>Shop</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- Breadcrumb Section End -->

            <h4>Department</h4>
            <ul>
              <li *ngFor="let category of categories">
                <a href="#" (click)="onCategoryChange(category.id); $event.preventDefault()">{{ category.name }}</a>
              </li>
            </ul>
          </div>
          <div class="sidebar__item">
            <h4>Price</h4>
            <div class="price-range-wrap">
              <div class="price-range ui-slider ui-corner-all ui-slider-horizontal ui-widget ui-widget-content"

                <div class="ui-slider-range ui-corner-all ui-widget-header"></div>
                <span tabindex="0" class="ui-slider-handle ui-corner-all ui-state-default"></span>
                <span tabindex="0" class="ui-slider-handle ui-corner-all ui-state-default"></span>
              </div>
              <div class="range-slider">
                <div class="price-input">
                  <input type="text" id="minamount">
                  <input type="text" id="maxamount">
                </div>
              </div>
            </div>

          <div class="sidebar__item">
            <div class="latest-product__text">
              <h4>Latest Products</h4>
              <app-latest-product-slider ngSkipHydration></app-latest-product-slider>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-9 col-md-7">
        <div class="product__discount">
          <div class="section-title product__discount__title">
            <h2>Sale Off</h2>
          </div>
          <app-product-discount-slider ngSkipHydration></app-product-discount-slider>
        </div>
        <div class="filter__item">
          <div class="row">
            <div class="col-lg-4 col-md-5">
              <div class="filter__sort">
                <span>Sort By:</span>
                <ng-select
                  [items]="sortOptions"
                  bindLabel="label"
                  [(ngModel)]="selectedSort"
                  (change)="onNgSelectSortChange($event)"
                  [compareWith]="compareByValue"
                  class="ngselect-sort"
                  [clearable]="false">
                </ng-select>
              </div>
            </div>
            <div class="col-lg-4 col-md-4">
              <div class="filter__found">
                <h6>Hiển thị {{ getDisplayedProductsInfo() }} sản phẩm</h6>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div *ngFor="let product of products" class="col-lg-4 col-md-6 col-sm-6">
            <div class="product__item">
              <div class="product__item__pic" [style.background-image]="'url(' + product.thumbnail + ')'" [routerLink]="['/product', product.id]">
                <ul class="product__item__pic__hover">
                  <li><a href="#"><i class="fa fa-heart"></i></a></li>
                  <li><a href="#"><i class="fa fa-retweet"></i></a></li>
                  <li><a href="#"><i class="fa fa-shopping-cart"></i></a></li>
                </ul>
              </div>
              <div class="product__item__text">
                <h6><a [routerLink]="['/product', product.id]">{{ product.name }}</a></h6>
                <h5>{{ product.price | currency:'USD' }}</h5>
              </div>
            </div>
          </div>
        </div>
        <div class="product__pagination">
          <!-- Nút Đầu -->
          <a href="#" (click)="onPageChange(1); $event.preventDefault()" [class.disabled]="currentPage === 1" title="Trang đầu">
            <i class="fa fa-angle-double-left"></i>
          </a>
          <!-- Nút Trang trước -->
          <a href="#" (click)="onPageChange(currentPage-1); $event.preventDefault()" [class.disabled]="currentPage === 1" title="Trang trước">
            <i class="fa fa-long-arrow-left"></i>
          </a>

          <!-- Các số trang với logic thông minh -->
          <ng-container *ngFor="let page of visiblePages">
            <a *ngIf="page !== '...'" href="#" (click)="onPageChange(+page); $event.preventDefault()" [class.active]="currentPage === +page">{{ page }}</a>
            <span *ngIf="page === '...'" class="pagination-dots">...</span>
          </ng-container>

          <!-- Nút Trang sau -->
          <a href="#" (click)="onPageChange(currentPage+1); $event.preventDefault()" [class.disabled]="currentPage === totalPages" title="Trang sau">
            <i class="fa fa-long-arrow-right"></i>
          </a>
          <!-- Nút Cuối -->
          <a href="#" (click)="onPageChange(totalPages); $event.preventDefault()" [class.disabled]="currentPage === totalPages" title="Trang cuối">
            <i class="fa fa-angle-double-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- Product Section End -->
<app-footer></app-footer>
