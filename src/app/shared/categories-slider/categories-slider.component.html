<div class="row">
  <div class="categories__slider owl-carousel">
    <div class="col-lg-3" *ngFor="let category of categories">
      <div class="categories__item">
        <div class="categories__item-image" [style.backgroundImage]="'url(' + category.image + ')'">
        </div>
        <h5><a href="#" (click)="onCategoryClick(category.id); $event.preventDefault()">{{ category.name }}</a></h5>
      </div>
    </div>
  </div>
</div>
