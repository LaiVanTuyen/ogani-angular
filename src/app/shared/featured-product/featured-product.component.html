<section class="featured spad">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="section-title">
          <h2>Featured Product</h2>
        </div>
        <div class="featured__controls">
          <ul>
            <li [class.active]="categoryId === 0" (click)="filterByCategory(0)">All</li>
            <li *ngFor="let category of categories"
                [class.active]="categoryId === category.id"
                (click)="filterByCategory(category.id)">{{ category.name }}
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="row featured__filter">
      <div *ngFor="let product of products" class="col-lg-3 col-md-4 col-sm-6 mix {{ getProductCategoryClasses(product) }}">
        <div class="featured__item">
          <div class="featured__item__pic" [ngStyle]="{'background-image': 'url(' + getProductImageUrl(product) + ')', 'background-size': 'contain', 'background-repeat': 'no-repeat', 'background-position': 'center'}">
            <div *ngIf="product.actualSalePercent" class="product__discount__percent">
              -{{ product.actualSalePercent }}%
            </div>
            <ul class="featured__item__pic__hover">
              <li><a href="#"><i class="fa fa-heart"></i></a></li>
              <li><a href="#"><i class="fa fa-retweet"></i></a></li>
              <li><a href="#"><i class="fa fa-shopping-cart"></i></a></li>
            </ul>
          </div>
          <div class="featured__item__text">
            <h6><a href="#">{{ product.name }}</a></h6>
            <h5 *ngIf="product.actualSalePercent; else noDiscount">
              {{ (product.price * (1 - product.actualSalePercent / 100)) | currency:'USD' }}
              <span style="text-decoration: line-through; color: #888; font-size: 13px; margin-left: 4px;">
                {{ product.price | currency:'USD' }}
              </span>
            </h5>
            <ng-template #noDiscount>
              <h5>{{ product.price | currency:'USD' }}</h5>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
    <nav class="shop-pagination d-flex justify-content-center mt-4">
      <ul class="pagination">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" href="#" (click)="changePage(currentPage - 1, $event)">Previous</a>
        </li>
        <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index" [class.active]="currentPage === (i+1)">
          <a class="page-link" href="#" (click)="changePage(i+1, $event)">{{ i+1 }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" href="#" (click)="changePage(currentPage + 1, $event)">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</section>
