<div class="product__details__pic__item" *ngIf="productImages.length > 0">
    <img class="product__details__pic__item--large"
         [src]="productImages[0].image_url" alt="">
</div>
<div class="product__details__pic__slider owl-carousel" *ngIf="productImages.length > 0">
    <img *ngFor="let image of productImages" [attr.data-imgbigurl]="image.image_url"
         [src]="image.image_url" alt="">
</div>
